<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
  </script>
</head>
<body>
  <!-- Filled by app.js from its list of desks. -->
  <header id="pipeline"></header>

  <div id="scene"></div>
  <div id="tags"></div>

  <footer id="hud">
    <div class="stat"><span class="label">Elapsed</span><span id="elapsed">00:00</span></div>
    <div class="stat"><span class="label">Tokens in / out</span><span id="tokens">—</span></div>
    <div class="progress"><div id="progress-bar"></div></div>
    <button id="reset" type="button">Reset</button>
  </footer>

  <script type="module">
    import { mountChrome } from '/chrome.js';

    // ?embed: the VS Code extension shows status and reset itself, so the page keeps only the scene.
    document.body.classList.toggle('embed', new URLSearchParams(location.search).has('embed'));
    mountChrome();
    await import('/app.js');
  </script>
</body>
</html>
