name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "In VS Code run **IT-Office-3D: Show Diagnostics** from the Command Palette and paste the output. It contains no prompts, file contents or command output."
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where do you watch the scene?
      options:
        - VS Code panel
        - Cursor / Antigravity / other editor (installed from .vsix)
        - Web browser
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
