# Push a tag like v0.4.0 (matching vscode/package.json) to build the .vsix and publish a GitHub release
# with the notes from vscode/CHANGELOG.md. The VS Code Marketplace upload stays a manual step.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match vscode/package.json $version"; exit 1; }
      - run: npm test
        working-directory: packages/core
      - run: node scripts/smoke.mjs
      - run: npm test
        working-directory: vscode
      - run: npm run package
        working-directory: vscode
      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" vscode/*.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
